<!doctype html><pre id="result">running</pre>
<script type="module">
try {
  const source = (await import('/src/engine/WebGL2Renderer.ts?raw')).default;
  const gl = document.createElement('canvas').getContext('webgl2');
  const results = [];
  for (const [name, type] of [['PLANET_VERT', gl.VERTEX_SHADER], ['PLANET_FRAG', gl.FRAGMENT_SHADER]]) {
    const code = source.split('const ' + name + ' = `')[1].split('`;')[0];
    const shader = gl.createShader(type);
    gl.shaderSource(shader, code);
    gl.compileShader(shader);
    results.push(name + ': ' + (gl.getShaderParameter(shader, gl.COMPILE_STATUS) ? 'PASS' : gl.getShaderInfoLog(shader)));
  }
  const adapter = await navigator.gpu?.requestAdapter();
  if (adapter) {
    const device = await adapter.requestDevice();
    const code = (await import('/src/engine/shaders/planet.wgsl?raw')).default;
    const module = device.createShaderModule({code});
    const info = await module.getCompilationInfo();
    results.push('WGSL: ' + (info.messages.length ? info.messages.map(m => m.type + ': ' + m.lineNum + ': ' + m.message).join('\n') : 'PASS'));
  } else results.push('WGSL: no adapter');
  document.getElementById('result').textContent = results.join('\n');
} catch(error) { document.getElementById('result').textContent = String(error); }
</script>
