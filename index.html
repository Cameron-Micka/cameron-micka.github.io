<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0806" />

    <title>Cameron Micka — Principal Software Engineer</title>
    <meta
      name="description"
      content="Cameron Micka — Principal Software Engineer (Microsoft Mesh, MRTK, HoloLens). A WebGPU 'Time Machine' career timeline."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cameron Micka — Principal Software Engineer" />
    <meta
      property="og:description"
      content="A WebGPU 'Time Machine' career timeline. Microsoft · Fun Bits · LucasArts · DigiPen."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />

    <!-- Display face for the wordmarks. Everything else uses the system mono. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Michroma&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Boot skeleton — replaced once React hydrates. Keeps first paint instant. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #0a0806;
        color: #f4dcbe;
        font-family:
          ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas,
          'DejaVu Sans Mono', monospace;
      }
      #boot-skeleton {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(
          120% 120% at 50% 40%,
          #1c0d03 0%,
          #0b0705 55%,
          #050403 100%
        );
        z-index: 9999;
        transition: opacity 0.6s ease;
      }
      #boot-skeleton .pulse {
        width: 46px;
        height: 46px;
        border: 2px solid #ff7a18;
        box-shadow:
          0 0 24px 2px rgba(255, 122, 24, 0.45),
          inset 0 0 18px rgba(255, 122, 24, 0.25);
        animation: bootpulse 1.8s ease-in-out infinite;
      }
      /* Scanlines so the pre-hydration frame reads the same as the app. */
      #boot-skeleton::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.3) 0 1px,
          transparent 1px 3px
        );
        opacity: 0.5;
      }
      html.crt-off #boot-skeleton::after {
        display: none;
      }
      @keyframes bootpulse {
        0%,
        100% {
          transform: scale(0.85) rotate(0deg);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.05) rotate(45deg);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-skeleton .pulse {
          animation: none;
        }
        #boot-skeleton {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-skeleton" aria-hidden="true"><div class="pulse"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
