<!doctype html>
<html lang="en" class="crt-off">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <script>
      // Applies the saved theme (Settings > Theme, keyed like src/settings.ts)
      // before first paint so dark mode never flashes light on load.
      (function () {
        try {
          var theme = JSON.parse(
            localStorage.getItem('cm-portfolio-settings') || '{}',
          ).theme;
          if (
            theme === 'dark' ||
            (theme !== 'light' &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          )
            document.documentElement.classList.add('theme-dark');
        } catch (error) {}
      })();
    </script>
    <style>
      /* Boot skeleton — replaced once React hydrates. Keeps first paint instant. */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        color: #343941;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      html {
        background: #eef0f3;
        color-scheme: light;
      }
      #boot-skeleton {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #eef0f3;
        z-index: 9999;
        transition: opacity 0.6s ease;
      }
      #boot-skeleton .pulse {
        width: 96px;
        height: 6px;
        background: #f5656b;
        border-radius: 999px;
        box-shadow:
          4px 4px 12px #c7cbd3,
          -4px -4px 12px #fff;
        animation: bootpulse 1.8s ease-in-out infinite;
      }
      html.theme-dark,
      html.theme-dark #boot-skeleton {
        color: #e4e7ec;
        background: #15181e;
        color-scheme: dark;
      }
      html.theme-dark #boot-skeleton .pulse {
        box-shadow: 4px 4px 12px #00000080;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-skeleton .pulse {
          animation: none;
        }
        #boot-skeleton {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-skeleton" aria-hidden="true"><div class="pulse"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
